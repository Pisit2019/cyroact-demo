  .pt-gold { fill:#f2c14e; stroke:#0e1116; stroke-width:1; }
  .lab { font-family:'Segoe UI',system-ui,sans-serif; font-size:15px; fill:#e6edf3; }
  .var { font-family:'Cambria Math',Georgia,serif; font-style:italic; font-size:17px; fill:#e6edf3; }
  .muted { font-family:'Segoe UI',system-ui,sans-serif; font-size:12.5px; fill:#9aa4ad; }
  .box { fill:none; stroke:#4b5563; stroke-width:1.2; stroke-dasharray:5 5; }
</style>
