    <title>CYROACT Version 0.0.1 (23.September.2026) — Cycloidal Robotic Actuation Technology</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #e0e6ee;
        font-family: 'Leelawadee UI', 'Noto Sans Thai', system-ui, sans-serif;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }

      #viewport {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* lil-gui จะถูก mount เข้าตรงนี้ใน Phase 3 */
      #gui-root {
        position: absolute;
        top: 12px;
        right: 12px;
        max-height: calc(100% - 24px);
        overflow-y: auto;
      }

      /* ---------------------------------------------------------------
         แถวสไลเดอร์ที่ป้ายยาวเกินความกว้างแผง
         (partPanel.ts วัดความกว้างป้ายจริงแล้วเติมคลาส stacked-label)

         lil-gui บังคับป้ายเป็นบรรทัดเดียว (white-space: pre) — ป้ายอย่าง
         "Inner Housing Radius(For Housing-Pins Only )" กว้าง 226 px ในแถว
         228 px จึงดันสไลเดอร์+ช่องตัวเลขล้นขอบแผง (สไลเดอร์เหลือ 4 px)
         → แถวเหล่านี้สลับเป็นแนวตั้ง: ป้ายบรรทัดบน · สไลเดอร์บรรทัดล่าง

         ⚠️ ต้อง specificity สูงกว่า CSS ของ lil-gui (ฝังมากับ JS)
         --------------------------------------------------------------- */
      .lil-gui .controller.stacked-label {
        flex-direction: column;
        align-items: stretch;
      }

      .lil-gui .controller.stacked-label > .name {
        min-width: 0;
        white-space: normal;
        padding-right: 0;
        line-height: 1.35;
      }

      .lil-gui .controller.stacked-label .widget {
        width: 100%;
        margin-top: 2px;
      }

      /* ---------------------------------------------------------------
         แถวข้อความ Base Circle (R) / Rolling Circle (r) เหนือสไลเดอร์ D
         (partPanel.ts แทรก div.pp-calc-note ก่อนแถวสไลเดอร์ D —
          คิดสดจากค่า D,N เหมือนกลุ่ม outer_housing ใน GUI 2D)
         --------------------------------------------------------------- */
      .lil-gui .pp-calc-note {
        padding: 3px 8px 4px;
        font-size: 11px;
        line-height: 1.4;
        color: #dfe6ec;
        opacity: 0.9;
        white-space: normal;
      }

      /* ---------------------------------------------------------------
         Sidebar ซ้าย — ผังชิ้นส่วนแบบโฟลเดอร์ (งาน 2: standalone viewer)
         คลิกชิ้น → partPanel (แผงขวา) แสดงสไลเดอร์ของชิ้นนั้น
         --------------------------------------------------------------- */
      #sidebar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 238px;
        overflow-y: auto;
        background: #1f1f1f; /* = lil-gui --background-color */
        border-right: 1px solid #000;
        font-size: 12px;
        color: #ebebeb; /* = lil-gui --text-color */
        color-scheme: dark;
        z-index: 10;
      }

      .sb-title {
        padding: 10px 12px 8px;
        background: #111111; /* = lil-gui --title-background-color */
        border-bottom: 1px solid #333333;
      }

      .sb-title-main {
        display: block;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.2px;
        color: #ffffff;
      }

      .sb-title-sub {
        display: block;
        margin-top: 2px;
        font-size: 11px;
        color: #9a9a9a;
      }

      .sb-compact {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 8px;
        font-size: 11px;
        color: #b6bdc4;
        cursor: pointer;
        user-select: none;
      }

      .sb-compact .sb-toggle {
        width: 13px;
        height: 13px;
      }

      .sb-module {
        border-bottom: 1px solid #333333;
      }

      .sb-module-head {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 7px 10px;
      }

      .sb-module-head:hover {
        background: #2a2a2a;
      }

      .sb-module-collapse {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        padding: 0;
        border: 0;
        background: transparent;
        font: inherit;
        text-align: left;
        cursor: pointer;
        color: inherit;
      }

      .sb-toggle {
        flex: none;
        width: 14px;
        height: 14px;
        margin: 0;
        cursor: pointer;
        accent-color: #2d7ff9;
      }

      .sb-toggle:disabled {
        cursor: default;
        opacity: 0.4;
      }

      .sb-caret {
        font-size: 9px;
        color: #9a9a9a;
        transition: transform 0.12s;
      }

      .sb-module.collapsed .sb-caret {
        transform: rotate(-90deg);
      }

      .sb-module.collapsed .sb-parts {
        display: none;
      }

      .sb-module-name {
        flex: 1;
        font-weight: 600;
      }

      .sb-module-count {
        font-size: 11px;
        color: #9a9a9a;
      }

      .sb-parts {
        display: flex;
        flex-direction: column;
        padding: 2px 6px 8px;
      }

      /* Compact: ตลับลูกปืน 3 ชิ้นยุบเป็นแถวเดียว (กางดู component ได้) */
      .sb-bearing {
        margin: 2px 0;
      }

      .sb-bearing-head {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 6px 5px 10px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        color: #c7ccd1;
        text-align: left;
        cursor: pointer;
      }

      .sb-bearing-head:hover {
        background: #2a2a2a;
      }

      .sb-bearing-name {
        flex: 1;
        min-width: 0;
      }

      .sb-bearing.collapsed .sb-caret {
        transform: rotate(-90deg);
      }

      .sb-bearing.collapsed .sb-bearing-parts {
        display: none;
      }

      .sb-bearing-parts {
        display: flex;
        flex-direction: column;
        margin-left: 6px;
        padding-left: 8px;
        border-left: 1px solid #333333;
      }

      .sb-bearing[hidden],
      .sb-part-row[hidden] {
        display: none;
      }

      .sb-part-row {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 6px 0 4px;
        border-radius: 5px;
      }

      .sb-part-row:hover {
        background: #2a2a2a;
      }

      .sb-part-row.selected {
        background: #274a73;
        outline: 1px solid #4c9aff;
      }

      .sb-part {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        padding: 5px 2px 5px 0;
        border: 0;
        background: transparent;
        font: inherit;
        text-align: left;
        cursor: pointer;
        color: inherit;
      }

      .sb-part-row[data-state='skipped'] .sb-label {
        color: #7f8a93;
      }

      .sb-dot {
        flex: none;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #37b24d;
      }

      .sb-part-row[data-state='hidden'] .sb-dot,
      .sb-dot[data-legend='hidden'] {
        background: #f0a202;
      }

      .sb-part-row[data-state='skipped'] .sb-dot,
      .sb-dot[data-legend='skipped'] {
        background: #9aa4ad;
      }

      .sb-label {
        flex: 1;
        line-height: 1.25;
      }

      .sb-legend {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 8px 12px 12px;
        font-size: 11px;
        color: #9a9a9a;
      }

      .sb-legend-item {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      /* ติ๊กใน legend = ตัวอย่างสัญลักษณ์ ไม่ใช่ตัวควบคุม — ไม่ต้องจาง */
      .sb-legend .sb-toggle:disabled {
        opacity: 1;
      }

      .sb-footer {
        position: sticky;
        bottom: 0;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 12px 9px;
        background: #1f1f1f;
        border-top: 1px solid #333333;
        font-size: 11px;
      }

      .sb-footer-sep {
        color: #555555;
      }

      .sb-footer a {
        color: #8ab4f8;
        text-decoration: none;
      }

      .sb-footer a:hover {
        text-decoration: underline;
      }

      #status {
        position: absolute;
        left: 250px;
        bottom: 12px;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.85);
        font-size: 12px;
        color: #333;
        pointer-events: none;
      }

      /* ตัวแสดงอัตราทด/มุมขบ — เหมือน annotation ของ GUI 2D
         (สีเหลือง 255,230,0 · บนกลางจอ · อัปเดตตามสไลเดอร์ N/e/D) */
      #core-readout {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        padding: 5px 14px;
        border-radius: 8px;
        background: rgba(24, 28, 34, 0.72);
        color: #ffe600;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.45;
        text-align: center;
        white-space: pre-line;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        z-index: 12; /* เหนือ sidebar (10) — ห้ามถูกบัง ทุกขนาดจอ */
      }
    </style>
    <script type="module" crossorigin src="./assets/index-qVEs4I0u.js"></script>
  </head>
  <body>
    <div id="app">
      <canvas id="viewport"></canvas>
      <div id="sidebar"></div>
      <div id="gui-root"></div>
      <div id="core-readout"></div>
      <div id="status">Loading 3D scene…</div>
    </div>
  </body>
</html>
