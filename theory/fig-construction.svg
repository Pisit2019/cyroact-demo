<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 780" width="820" height="780" role="img" aria-labelledby="fig1-title fig1-desc">
<title id="fig1-title">Geometric construction of the generating center</title>
<desc id="fig1-desc">Base circle of radius R centered at O, externally tangent rolling circle of radius r centered at B, contact point D, generating center C, angle theta and rolling angle beta.</desc>
